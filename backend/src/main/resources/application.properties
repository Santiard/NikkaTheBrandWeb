# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=8081

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS LOCAL Y PRODUCCIÓN (MARIADB)
# ===================================================================
# La base de datos "nikka_db" se creará AUTOMÁTICAMENTE si no existe
spring.datasource.url=jdbc:mariadb://localhost:3306/nikka_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
# Credenciales de MariaDB configuradas para tu entorno local:
spring.datasource.username=root
spring.datasource.password=admin123

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS DE RESPALDO (H2 DESACTIVADA)
# ===================================================================
# spring.datasource.url=jdbc:h2:file:./data/nikkadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=false

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# "update" creará automáticamente las tablas en tu DB local al iniciar Spring Boot.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ===================================================================
# CONFIGURACIÓN DE SPRING SECURITY
# ===================================================================
# Credenciales para el panel de administración
spring.security.user.name=chiltepic
spring.security.user.password=zayn2000

# ===================================================================
# CONFIGURACIÓN DE JACKSON
# ===================================================================
# Evita errores al serializar proxies perezosos (Lazy) de Hibernate
spring.jackson.serialization.fail-on-empty-beans=false

