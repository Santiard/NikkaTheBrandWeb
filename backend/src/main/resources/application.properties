# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=8080

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS LOCAL Y PRODUCCIÓN (POSTGRESQL)
# ===================================================================
# Asegúrate de crear primero la base de datos vacía "nikka_db" en tu PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/nikka_db
spring.datasource.driverClassName=org.postgresql.Driver
# Modifica estas credenciales con tu usuario y contraseña de PostgreSQL si son diferentes:
spring.datasource.username=postgres
spring.datasource.password=postgres123

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS DE RESPALDO (H2 DESACTIVADA)
# ===================================================================
# spring.datasource.url=jdbc:h2:file:./data/nikkadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=false

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# "update" creará automáticamente las tablas en tu DB local al iniciar Spring Boot.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACIÓN DE SPRING SECURITY
# ===================================================================
# Deshabilitar seguridad básica temporalmente para desarrollo o configurar permit-all
# spring.security.user.name=admin
# spring.security.user.password=admin123

# ===================================================================
# PROPIEDADES DE NEGOCIO DE NIKKA
